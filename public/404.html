<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "");
        var m = path.match(/\/account\/orders\/([^/]+)$/);
        if (m && m[1] && m[1] !== "view") {
          location.replace(
            "/account/orders/view/?id=" + encodeURIComponent(m[1])
          );
          return;
        }
        location.replace("/");
      })();
    </script>
  </head>
  <body>
    <p>Page not found. <a href="/">Go home</a></p>
  </body>
</html>
